name = "personalweb-views"
main = "src/counter.js"
compatibility_date = "2026-01-01"

# 放行的站点来源。只回显这一个 Origin，不写 * ——
# 写 * 等于允许任何网站替你刷数。本地调试时临时改成 http://localhost:5173。
[vars]
ALLOWED_ORIGIN = "https://blog.yingtongxue.cn"

# 计数存放处。id 需要先执行 `npx wrangler kv namespace create VIEWS` 生成后填回。
# 占位串保持醒目而非留空：留空会让 wrangler 报一个含糊的绑定错误，
# 而这里写死一个假 id 会让部署在第一步就明确失败。
[[kv_namespaces]]
binding = "VIEWS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# STATS_TOKEN 不写在这里。它是读取全部统计的口令，
# 必须用 `npx wrangler secret put STATS_TOKEN` 存进 secret，
# 本文件是入库的，任何写进来的口令等于公开发布。
